site_name: ShannonStore
site_url: https://cloudcheflabs.github.io/shannonstore-docs
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
    - header.autohide
  language: en
  palette:
    - scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
      primary: custom
      accent: purple
    - scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
      primary: custom
      accent: lime
  logo: images/logo/shannonstore-logo-without-name.png
  favicon: images/logo/shannonstore-logo-without-name.png


nav:
  - "Home": index.md
  - "Architecture":
      - "ShannonStore Architecture": architecture/architecture.md
  - "Installation":
      - "Download & Install": installation/installation.md
      - "Getting Started": installation/getting-started.md
  - "Features":
      - "S3 Compatible API": features/s3-compatible-api.md
      - "Bucket Configuration": features/bucket-configuration.md
      - "Storage Classes & Tiering": features/storage-classes-tiering.md
      - "Bucket Counters": features/bucket-counters.md
      - "Site Replication": features/site-replication.md
      - "Distributed Architecture": features/distributed-architecture.md
      - "Erasure Coding": features/ec.md
      - "Topology-Aware Placement": features/placement-cascade.md
      - "NIC Silent-Fail Safety": features/nic-fail-safety.md
      - "Data Integrity": features/data-integrity.md
      - "Encryption & Key Management": features/kms.md
      - "Data Compression": features/data-compression.md
      - "Identity & Access Management": features/iam.md
      - "Authentication & Authorization": features/auth-authz.md
      - "Object Lock (WORM)": features/worm.md
      - "Admin Password Recovery": features/admin-password-recovery.md
      - "Disk Repair Service": features/disk-repair.md
      - "Monitoring & Metrics": features/monitoring.md
      - "Metadata Management": features/metadata-management.md
      - "Multi-Disk Storage": features/multi-disk-storage.md
      - "Performance Optimization": features/performance.md
      - "Maintenance Mode": features/maintenance.md
      - "Backup & Restore": features/backup.md
      - "Configuration Management": features/configuration.md
      - "Network & Internal Communication": features/network.md
  - "Operations":
      - "Cluster Operations": operations/operations.md
      - "Nginx Reverse Proxy": operations/nginx-proxy.md


extra:
  generator: false
  version:
    provider: mike
    default: 2.2.0


extra_css:
  - stylesheets/extra.css


extra_javascript:
  - javascripts/extra.js


markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.mark
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg

copyright: |
  © <script>document.write(new Date().getFullYear())</script> Cloud Chef Labs, Inc. All rights reserved. <a href="mailto:admin@cloudchef-labs.com">admin@cloudchef-labs.com</a>
